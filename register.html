<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Daftar | SkillGap.AI</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4" crossorigin="anonymous"></script>
    <style>
      body {
        background: linear-gradient(135deg, #f8fafc 0%, #eef4ff 100%);
      }
      .shadow-soft { box-shadow: 0 20px 45px rgba(15, 23, 42, 0.08); }
    </style>
  </head>
  <body class="min-h-screen text-slate-800 antialiased">
    <div aria-live="polite" aria-atomic="true" id="toast" class="pointer-events-none fixed right-5 top-5 z-50 hidden rounded-xl border border-emerald-500/30 bg-emerald-500/10 px-4 py-3 text-sm font-medium text-emerald-700 shadow-soft"></div>

    <main class="mx-auto flex min-h-screen max-w-7xl items-center justify-center px-4 py-10 sm:px-6 lg:px-8">
      <div class="grid w-full max-w-5xl overflow-hidden rounded-[32px] border border-slate-200 bg-white shadow-soft lg:grid-cols-[0.95fr_1.05fr]">
        <section class="hidden bg-gradient-to-br from-slate-900 via-slate-800 to-slate-700 p-8 text-white lg:flex lg:flex-col lg:justify-between">
          <div>
            <div class="inline-flex items-center gap-3 rounded-full border border-white/15 bg-white/5 px-3 py-1.5 text-sm font-medium text-white">
              <span class="flex h-8 w-8 items-center justify-center rounded-xl bg-gradient-to-br from-indigo-500 to-sky-400 font-black text-white">S</span>
              SkillGap.AI
            </div>
          </div>

          <div>
            <p class="text-sm uppercase tracking-[0.24em] text-slate-300">Jadilah bagian dari perubahan</p>
            <h1 class="mt-4 text-4xl font-black leading-tight text-white">Bangun masa depanmu dengan data dan AI.</h1>
            <p class="mt-4 max-w-md text-base text-slate-300">Daftar sekarang untuk mendapatkan roadmap belajar, rekomendasi karier, dan pemetaan skill-gap yang lebih personal.</p>
          </div>

          <div class="flex items-center gap-3 text-sm text-slate-300">
            <span class="inline-flex h-2.5 w-2.5 rounded-full bg-emerald-400"></span>
            Personal growth intelligence
          </div>
        </section>

        <section class="p-6 sm:p-10">
          <div class="mb-8 flex items-center justify-between">
            <div>
              <p class="text-sm font-bold uppercase tracking-[0.22em] text-indigo-600">Daftar</p>
              <h2 class="mt-2 text-3xl font-black tracking-tight text-slate-900">Buat akun baru</h2>
            </div>
            <a href="index.html" class="rounded-full border border-slate-200 bg-slate-50 px-3 py-1.5 text-xs font-semibold text-slate-600 transition hover:border-indigo-200 hover:text-indigo-600">Home</a>
          </div>

          <form data-auth-form="register" novalidate class="space-y-5">
            <div class="grid gap-5 sm:grid-cols-2">
              <div>
                <label for="register-name" class="mb-2 block text-sm font-medium text-slate-700">Nama lengkap</label>
                <input id="register-name" name="name" type="text" required class="w-full rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 text-slate-900 placeholder:text-slate-400 focus:border-indigo-400 focus:outline-none" placeholder="Nama lengkap" aria-label="Nama lengkap" />
              </div>
              <div>
                <label for="register-role" class="mb-2 block text-sm font-medium text-slate-700">Peran</label>
                <select id="register-role" name="role" required class="w-full rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 text-slate-900 focus:border-indigo-400 focus:outline-none" aria-label="Pilih peran">
                  <option value="">Pilih</option>
                  <option value="mahasiswa">Mahasiswa</option>
                  <option value="siswa">Pelajar SMA/SMK</option>
                  <option value="dosen">Dosen</option>
                  <option value="guru-bk">Guru BK</option>
                </select>
              </div>
            </div>

            <div>
              <label for="register-email" class="mb-2 block text-sm font-medium text-slate-700">Email</label>
              <input id="register-email" name="email" type="email" required class="w-full rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 text-slate-900 placeholder:text-slate-400 focus:border-indigo-400 focus:outline-none" placeholder="nama@email.com" aria-label="Alamat email" />
            </div>

            <div>
              <label for="register-password" class="mb-2 block text-sm font-medium text-slate-700">Password</label>
              <input id="register-password" name="password" type="password" required class="w-full rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 text-slate-900 placeholder:text-slate-400 focus:border-indigo-400 focus:outline-none" placeholder="Minimal 8 karakter" aria-label="Password" />
            </div>

            <button type="submit" class="inline-flex w-full items-center justify-center rounded-2xl bg-gradient-to-r from-indigo-600 to-sky-500 px-4 py-3.5 text-sm font-semibold text-white shadow-soft transition hover:brightness-105">Daftar sekarang</button>
          </form>

          <div class="mt-6 text-center text-sm text-slate-600">
            Sudah punya akun?
            <a href="login.html" class="font-semibold text-indigo-600 hover:text-indigo-500">Masuk di sini</a>
          </div>
        </section>
      </div>
    </main>

    <script src="app.js"></script>
  </body>
</html>
