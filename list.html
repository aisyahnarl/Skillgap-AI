<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>List Data | SkillGap.AI</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4" crossorigin="anonymous"></script>
    <style>
      body {
        background: linear-gradient(180deg, #f8fafc 0%, #eef4ff 100%);
      }
      .shadow-soft { box-shadow: 0 20px 45px rgba(15, 23, 42, 0.08); }
    </style>
  </head>
  <body class="min-h-screen text-slate-800 antialiased">
    <div aria-live="polite" aria-atomic="true" id="toast" class="pointer-events-none fixed right-5 top-5 z-50 hidden rounded-xl border border-emerald-500/30 bg-emerald-500/10 px-4 py-3 text-sm font-medium text-emerald-700 shadow-soft"></div>

    <header class="border-b border-slate-200 bg-white/80 backdrop-blur-xl">
      <div class="mx-auto flex max-w-7xl items-center justify-between px-4 py-4 sm:px-6 lg:px-8">
        <div class="flex items-center gap-3">
          <span class="flex h-10 w-10 items-center justify-center rounded-xl bg-gradient-to-br from-indigo-600 to-sky-500 text-lg font-black text-white shadow-soft">S</span>
          <div>
            <p class="text-lg font-black text-slate-900">SkillGap.AI</p>
            <p class="text-xs text-slate-500">Data List</p>
          </div>
        </div>

        <nav class="hidden items-center gap-6 text-sm text-slate-600 md:flex" aria-label="Navigasi list data">
          <a href="dashboard.html" class="transition hover:text-indigo-600">Dashboard</a>
          <a href="assessment.html" class="transition hover:text-indigo-600">Assessment</a>
          <a href="docs/srs-matrix.html" class="transition hover:text-indigo-600">SRS Matrix</a>
        </nav>
      </div>
    </header>

    <main class="mx-auto max-w-7xl px-4 py-10 sm:px-6 lg:px-8">
      <section class="mb-8 rounded-[28px] border border-slate-200 bg-white p-6 shadow-soft">
        <div class="flex flex-col gap-4 md:flex-row md:items-center md:justify-between">
          <div>
            <p class="text-sm font-bold uppercase tracking-[0.22em] text-indigo-600">List / Detail</p>
            <h1 class="mt-3 text-4xl font-black tracking-tight text-slate-900">Data profil pengguna</h1>
          </div>
          <a href="assessment.html" class="inline-flex items-center rounded-xl bg-gradient-to-r from-indigo-600 to-sky-500 px-4 py-2.5 text-sm font-semibold text-white shadow-soft">Tambah data</a>
        </div>
      </section>

      <section class="rounded-[28px] border border-slate-200 bg-white p-5 shadow-soft">
        <div class="mb-5 flex flex-col gap-3 md:flex-row md:items-center md:justify-between">
          <div class="flex flex-wrap items-center gap-3">
            <input id="searchInput" type="search" aria-label="Cari data pengguna" placeholder="Cari nama, kategori, atau program..." class="w-full rounded-xl border border-slate-200 bg-slate-50 px-4 py-2.5 text-sm text-slate-900 placeholder:text-slate-400 focus:border-indigo-400 focus:outline-none md:w-80" />
            <select id="filterStatus" aria-label="Filter status" class="rounded-xl border border-slate-200 bg-slate-50 px-3 py-2.5 text-sm text-slate-900 focus:border-indigo-400 focus:outline-none">
              <option value="all">Semua status</option>
              <option value="valid">Valid</option>
              <option value="review">Review</option>
              <option value="pending">Pending</option>
            </select>
          </div>
        </div>

        <div class="mb-4 hidden rounded-2xl border border-amber-200 bg-amber-50 px-4 py-3 text-sm text-amber-700" id="listError" role="alert"></div>
        <div class="mb-4 hidden rounded-2xl border border-sky-200 bg-sky-50 px-4 py-3 text-sm text-sky-700" id="listLoading" aria-live="polite">Memuat data pengguna…</div>

        <div class="overflow-x-auto">
          <table class="min-w-full text-left text-sm text-slate-600">
            <thead class="border-b border-slate-200 text-slate-500">
              <tr>
                <th class="pb-3 pr-4 font-medium">Nama</th>
                <th class="pb-3 pr-4 font-medium">Kategori</th>
                <th class="pb-3 pr-4 font-medium">Target</th>
                <th class="pb-3 pr-4 font-medium">Kecocokan</th>
                <th class="pb-3 pr-4 font-medium">Status</th>
                <th class="pb-3 font-medium">Aksi</th>
              </tr>
            </thead>
            <tbody id="listTableBody" class="divide-y divide-slate-200"></tbody>
          </table>
        </div>
      </section>
    </main>

    <script type="module" src="app.js"></script>
  </body>
</html>
